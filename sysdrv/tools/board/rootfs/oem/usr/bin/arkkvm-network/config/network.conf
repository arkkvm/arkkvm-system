# network.conf — ArkKVM sole network config source
# After editing, run: refresh-network.sh  or  ./ctl refresh
# App layer (arkkvm_app) only reads/writes this file; no static_ip.conf / encrypted config network fields

[interface]
name=eth0

[system]
hostname=arkkvm
domain=local

[dhcp]
# DHCP backend: udhcpc | dhcpcd
# After switch, refresh stops the other backend; renew/restart/lease then use the selected backend only
client=udhcpc

[ipv4]
# Mode: dhcp | static | disabled
mode=dhcp

# Following fields apply when mode=static
address=192.168.5.100
netmask=255.255.255.0
gateway=192.168.5.1
dns=192.168.5.1 8.8.8.8

[ipv6]
# Mode: slaac | static | link_local | disabled
mode=slaac

# Used when mode=static
prefix=fd00::1/64
gateway=fd00::1
dns=fd00::1

[dns]
# Optional: forced static DNS (empty: dhcp syncs from lease; static uses ipv4.dns)
servers=

[vlan]
# VLAN mode: when enabled=true, [vlan.primary/secondary] drive subinterface L3;
# [ipv4] applies to parent management path (kept reachable under staging).
enabled=false
parent=eth0
# apply_mode: committed | staging (usually set by refresh --staging or vlan.rs)
apply_mode=committed

[vlan.primary]
id=10
ipv4_mode=dhcp
ipv4_address=
ipv4_netmask=
ipv4_gateway=
ipv4_dns=
ipv6_mode=slaac
ipv6_prefix=
ipv6_gateway=
ipv6_dns=
route_metric=0

[vlan.secondary]
# id=0 means secondary is not configured
id=0
ipv4_mode=disabled
ipv4_address=
ipv4_netmask=
ipv4_gateway=
ipv4_dns=
ipv6_mode=disabled
ipv6_prefix=
ipv6_gateway=
ipv6_dns=
route_metric=200
